<style>
/* The homepage is one city you drag around. Each district is a category, each building is one place to go.
   Building and scenery pictures live in assets/city/ (made in Canva). Single daytime theme. */
:root{
  color-scheme:light;
  --ink:#1d2a3a; --ink-soft:#52627a; --paper:#fffaf0; --line:#e3d9c3; --sun:#ffc93c; --go:#e4572e; --leaf:#3f9a5a;
  --sky1:#bfe6f5; --sky2:#e9f6ef;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--sky2);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky1),var(--sky2) 55%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#city{display:block;width:100%;height:100%}
.bld{cursor:pointer;outline:none}
.bld image{transition:filter .15s}
.bld:hover image,.bld:focus-visible image{filter:brightness(1.1) saturate(1.1)}
.bld.lk image{filter:grayscale(1) opacity(.55)}
.ring{opacity:0;fill:rgba(255,201,60,.35);stroke:var(--sun);stroke-width:5}
.bld.sel .ring,.bld:focus-visible .ring{opacity:1}
.lab{font:700 19px var(--body);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.lab.soft{fill:var(--ink-soft);font-weight:700;font-size:15px}
.emo{font-size:40px;pointer-events:none}
.dname{font:900 22px var(--body);fill:#fff;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .bld.sel .body{animation:hop .5s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
}

.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;display:flex;flex-direction:column;gap:8px}
.hud > *{pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;pointer-events:none}
.bar > *{pointer-events:auto}
.title{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.title small{display:block;font-weight:500;font-size:12px;opacity:.85}
.clock{margin-left:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-weight:900;font-size:20px;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.clock small{display:block;font-weight:500;font-size:11px;color:var(--ink-soft)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.who button{font:inherit;padding:3px 12px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
.who .msg{flex-basis:100%;color:var(--go)}
.who .msg:empty{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips button,.chips a{flex:none;font:700 14px var(--body);color:var(--ink);background:rgba(255,255,255,.94);border:2px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chips button.on{border-color:var(--ink);background:var(--sun)}
.chips a{background:var(--go);color:#fff}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.zoom{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.zoom button,.info{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.95);font:900 22px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.info{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:auto;padding:0 14px;font-size:14px;font-weight:700}
.info.cust{bottom:max(68px,calc(env(safe-area-inset-bottom) + 52px));width:44px;padding:0;font-size:20px;opacity:.85}
.hint{position:fixed;left:50%;bottom:max(74px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);background:rgba(29,42,58,.88);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}

.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);max-height:82vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;border:2px solid var(--line);border-bottom:0;padding:16px 18px max(18px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.22);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.sheet .x{position:absolute;right:10px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:#efe6d0;font-size:18px;cursor:pointer}
.sheet .where{font-weight:700;font-size:13px;color:var(--ink-soft)}
.sheet h2{margin:2px 40px 2px 0;font-size:22px;font-weight:900;line-height:1.3}
.sheet .age{display:inline-block;font-size:12px;font-weight:700;background:#efe6d0;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.sheet p{margin:4px 0 12px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.sheet p strong{color:var(--ink)}
.sheet .pic{float:right;width:92px;height:92px;object-fit:contain;margin:0 44px 6px 10px}
.go{display:flex;gap:8px;flex-wrap:wrap;clear:both}
.btn{flex:1 1 140px;text-align:center;text-decoration:none;background:var(--go);color:#fff;font-weight:900;font-size:17px;border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 #b9411f}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.9}
.btn.alt{background:var(--leaf);box-shadow:0 4px 0 #2b7240}
.btn.out{background:#9aa9b3;box-shadow:0 4px 0 #73828c}
.lockmsg{font-weight:700;color:var(--ink-soft)}
.sheet input{font:inherit;width:100%;padding:6px 10px;border:2px solid var(--line);border-radius:10px}
.sheet code{display:block;margin-top:8px;overflow-wrap:anywhere;user-select:all;font-size:13px}
.sheet .foot{font-size:12.5px;text-align:center;margin:14px 0 0}
.plain{position:fixed;inset:auto 12px 12px;background:var(--paper);border-radius:16px;padding:16px 20px;z-index:5}
</style>
</head>

function fly(x, y, s){
  cancelAnimationFrame(anim); var a = { x:cam.x, y:cam.y, s:cam.s }, t0 = performance.now();
  if (CALM){ cam.x = x; cam.y = y; cam.s = s; return apply(); }
  (function step(now){ var k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    cam.x = a.x + (x - a.x) * e; cam.y = a.y + (y - a.y) * e; cam.s = a.s + (s - a.s) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); })(t0);
}
function home(now){
  var c = iso((M - 1 + X1 + 1) / 2, (M - 1 + RIVER) / 2), w = (X1 - M + 2 + RIVER - M + 2) * TW / 2;
  var s = Math.min(1, stage.clientWidth / (w * .8)); s = Math.max(s, .42);
  var y = c[1] - 70 / s;            // leave room for the bar at the top
  if (now){ cam.x = c[0]; cam.y = y; cam.s = s; apply(); } else fly(c[0], y, s);
}
function zoomAt(f, px, py){
  var wx = (px - stage.clientWidth / 2) / cam.s + cam.x, wy = (py - stage.clientHeight / 2) / cam.s + cam.y;
  cam.s = Math.max(.3, Math.min(1.8, cam.s * f));
  cam.x = wx - (px - stage.clientWidth / 2) / cam.s; cam.y = wy - (py - stage.clientHeight / 2) / cam.s; apply();
}
stage.addEventListener("pointerdown", function(e){ ptrs[e.pointerId] = [e.clientX, e.clientY]; moved = 0; cancelAnimationFrame(anim);
  var k = Object.keys(ptrs); if (k.length === 2) pinch = dist(); });
stage.addEventListener("pointermove", function(e){
  var p = ptrs[e.pointerId]; if (!p) return;
  var dx = e.clientX - p[0], dy = e.clientY - p[1], k = Object.keys(ptrs);
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (k.length === 2){ var d = dist(); if (pinch) zoomAt(d / pinch, (ptrs[k[0]][0] + ptrs[k[1]][0]) / 2, (ptrs[k[0]][1] + ptrs[k[1]][1]) / 2); pinch = d; moved = 99; return; }
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6){ if (!stage.classList.contains("drag")){ stage.classList.add("drag"); try { stage.setPointerCapture(e.pointerId); } catch(_){} hideHint(); }
    cam.x -= dx / cam.s; cam.y -= dy / cam.s; apply(); }
});
function up(e){ delete ptrs[e.pointerId]; pinch = 0; stage.classList.remove("drag"); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
function dist(){ var k = Object.keys(ptrs); return Math.hypot(ptrs[k[0]][0] - ptrs[k[1]][0], ptrs[k[0]][1] - ptrs[k[1]][1]) || 1; }
stage.addEventListener("wheel", function(e){ e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive:false });
document.getElementById("zin").onclick = function(){ zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2); };
document.getElementById("zout").onclick = function(){ zoomAt(.8, stage.clientWidth / 2, stage.clientHeight / 2); };
document.getElementById("zhome").onclick = function(){ closeSheet(); home(); };
addEventListener("resize", apply);
function hideHint(){ document.getElementById("hint").classList.add("off"); }

/* ---------- picking a building ---------- */
var sheet = document.getElementById("sheet");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function btn(href, label, sub, cls, title){
  return '<a class="btn' + (cls ? " " + cls : "") + '" href="' + esc(href) + '"' + (title ? ' data-title="' + esc(title) + '"' : "") + ">" + label + "<small>" + sub + "</small></a>";
}
// TV minutes left today (same keys as tv/index.html)
var DEF = { s:20, m:40, b:60 };
function tvBtn(k, label, alt, ch){
  var st = get("kt.settings", {}), lim = st.limits || {}, used = get("kt.used", {});
  var L = lim[k] == null ? DEF[k] : lim[k], today = new Date().toLocaleDateString("sv");
  var u = used.date === today ? (used[k] || 0) : 0, left = Math.max(0, L * 60 - u);
  var sub = L <= 0 ? "不限時" : left <= 0 ? "今天看完了" : "還有 " + Math.ceil(left / 60) + " 分鐘";
  return btn("tv/?p=" + k + (ch ? "&c=" + encodeURIComponent(ch) : ""), label, sub, L > 0 && left <= 0 ? "out" : alt ? "alt" : "");
}
var picked = null;
function fill(){            // (re)draw the sheet of the picked building
  var d = picked._d, it = picked._it, go;
  if (locked(it)) go = '<span class="lockmsg">☁️ 長大一點再來探險</span>';
  else if (it.tv) go = (kid !== "b" ? tvBtn("m", "🦊 中孩") : "") + (kid !== "m" ? tvBtn("b", "🚀 大孩") : "") + tvBtn("s", "🐣 " + (kid === "a" ? "小小孩" : "帶小小孩看"), true);
  else if (it.six){
    var n = (get("kt.series", {})["The Six Minutes"]) || 1;
    go = btn("tv/?p=m", "▶ 聽故事", n > 1 ? "繼續聽第 " + n + " 集" : "從第 1 集開始") + btn("tv/?p=m&pick=1", "🔢 選集數", "自己挑一集", "alt");
  }
  else if (it.news) go = (kid !== "b" ? tvBtn("m", "🦊 中孩", false, "新聞超小號") : "") + (kid !== "m" ? tvBtn("b", "🚀 大孩", false, "新聞超小號") : "");
  else if (it.ext) go = btn(it.href, "🚪 出發", it.extName ? "到" + it.extName + "的網站" : "會離開 Kids School");
  // kq: the page keeps each kid's progress apart, so tell it whose turn it is (?k=m / ?k=b)
  else if (it.kq) go = kid === "a" ? btn(it.href + "?k=m", "🦊 中孩", "開始上課") + btn(it.href + "?k=b", "🚀 大孩", "開始上課", "alt")
                                   : btn(it.href + "?k=" + kid, "🚪 進去", "開始上課", "", it.title);
  else { var easy = kid === "m" && it.mHref; go = btn(easy ? it.mHref : it.href, "🚪 進去", easy ? "簡單版" : "開始探險", "", it.title); }
  sheet.innerHTML = '<button class="x" type="button" aria-label="關閉">✕</button><img class="pic" alt="" src="assets/city/' + it.img + '.webp"><div class="where">' + d.emo + " " + esc(d.name) +
    '</div><h2>' + it.emo + " " + esc(it.title) + '</h2><span class="age">' + esc(it.age) + "</span><p>" + esc(it.desc) + '</p><div class="go" data-d="' + d.id + '">' + go + "</div>";
  sheet.querySelector(".x").onclick = closeSheet;
}
function pick(g){
  world.querySelectorAll(".bld.sel").forEach(function(b){ b.classList.remove("sel"); }); g.classList.add("sel");
  picked = g; fill(); sheet.classList.add("open"); hideHint();
  var bb = g.getBBox(); fly(bb.x + bb.width / 2, bb.y + bb.height / 2 + 90 / Math.max(cam.s, .8), Math.max(cam.s, .8));
}
function closeSheet(){ picked = null; sheet.classList.remove("open"); world.querySelectorAll(".bld.sel").forEach(function(b){ b.classList.remove("sel"); }); }
world.addEventListener("click", function(e){ if (moved > 6) return; var g = e.target.closest(".bld"); if (g) pick(g); else closeSheet(); });
world.addEventListener("keydown", function(e){ var g = e.target.closest(".bld"); if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(g); } });
stage.addEventListener("click", function(e){ if (moved <= 6 && (e.target === stage || e.target.id === "city")) closeSheet(); });
addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });
// remember the last subject (per kid)
sheet.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a.btn[data-title]") : null;
  if (a) set(LK, { href:a.getAttribute("href"), title:a.dataset.title, island:a.parentNode.dataset.d });
});
addEventListener("pageshow", function(){ if (picked) fill(); });   // refresh TV minutes after coming back

/* ---------- HUD ---------- */
var chips = document.getElementById("chips");
function renderChips(){
  chips.innerHTML = DISTRICTS.map(function(d){ return '<button type="button" data-d="' + d.id + '">' + esc(d.emo + " " + d.name) + "</button>"; }).join("");
  if (last && last.href && last.title){
    var la = document.createElement("a"); la.href = last.href; la.id = "last"; la.textContent = "⏪ 上次：" + last.title + " →";

  }
}
chips.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
  var d = DISTRICTS.filter(function(x){ return x.id === b.dataset.d; })[0], c = iso(d.ox + BW / 2, d.oy + BD / 2);
  chips.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
  closeSheet(); hideHint(); fly(c[0], c[1] - 20, Math.min(1, stage.clientWidth / 720)); });
function tick(){
  var n = new Date(), h = n.getHours();
  var g = h < 5 ? "夜深了，該睡覺囉" : h < 11 ? "早安" : h < 13 ? "午安" : h < 18 ? "下午好" : "晚安";
  document.getElementById("greet").textContent = (NAME[kid] ? NAME[kid] + "，" : "") + g + "！想去哪一區？";
  document.getElementById("clock").textContent = n.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", hour12:false });
  document.getElementById("date").textContent = n.toLocaleDateString("zh-TW", { month:"numeric", day:"numeric", weekday:"short" });
}
if (kid !== "a") document.title = NAME[kid].slice(3) + "的首頁 · Kids School";

// ---- optional Google sign-in: personalization only, not access control (config: KS_AUTH above) ----
function sha256(s){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function normMail(s){ return String(s || "").trim().toLowerCase(); }
function jwtPayload(tok){      // read the (unverified) payload of the ID token; nothing is sent anywhere
  var seg = String(tok).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  while (seg.length % 4) seg += "=";
  var bin = atob(seg), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}
function jwtEmail(tok){ return normMail(jwtPayload(tok).email); }
(function(){
  if (!CID || qk != null) return;          // off, or an explicit ?k= page: no sign-in UI at all
  var box = document.getElementById("who"), roles = {};
  Object.keys(AUTH.ROLES || {}).forEach(function(h){ roles[h.toLowerCase()] = AUTH.ROLES[h]; });
  if (who){
    var lab = document.createElement("span"), out = document.createElement("button");
    lab.textContent = who === "p" ? "👨‍👩‍👧‍👦 爸爸媽媽：整座城市" : NAME[who] + "的城市";
    out.type = "button"; out.textContent = "換人";
    out.addEventListener("click", function(){ try { ["ks.who", "ks.idtok", "ks.cloud.role"].forEach(function(k){ localStorage.removeItem(k); }); } catch(e){} location.reload(); });
    box.appendChild(lab); box.appendChild(out); box.hidden = false;
    return;
  }
  var tip = document.createElement("span"), slot = document.createElement("span"), msg = document.createElement("span");
  tip.textContent = "登入變成你的城市："; msg.className = "msg"; msg.setAttribute("role", "status");
  box.appendChild(tip); box.appendChild(slot); box.appendChild(msg);
  function onCredential(resp){
    var mail = "";
    try { mail = jwtEmail(resp.credential); } catch(e){}
    if (!mail || !window.crypto || !crypto.subtle){ msg.textContent = "登入沒有成功，再試一次看看。"; return; }
    sha256(mail).then(function(h){
      var role = roles[h];
      if (role === "m" || role === "b" || role === "p"){
        set("ks.who", role);
        try { set("ks.idtok", { tok:resp.credential, exp:jwtPayload(resp.credential).exp }); } catch(e){}   // lets pages save to the cloud for the next hour (assets/ks-cloud.js)
        location.reload();
      }
      else msg.textContent = "這個帳號還沒登記喔，先看整座城市。請爸爸媽媽幫你加上去！";
    }, function(){ msg.textContent = "登入沒有成功，再試一次看看。"; });
  }
  var s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client?hl=zh-TW"; s.async = true;
  s.onload = function(){
    try {
      google.accounts.id.initialize({ client_id: CID, callback: onCredential, auto_select: false });
      google.accounts.id.renderButton(slot, { type:"standard", theme:"outline", size:"medium", shape:"pill", text:"signin", locale:"zh_TW" });
      box.hidden = false;
    } catch(e){}
  };
  document.head.appendChild(s);            // if it cannot load (offline, blocked) the page just stays as it is
})();

// ---- "for grown-ups" sheet; with ?hash=1 it also holds the email -> code helper for KS_AUTH.ROLES ----
function infoSheet(){
  closeSheet();
  sheet.innerHTML = '<button class="x" type="button" aria-label="關閉">✕</button><h2>ℹ️ 給大人的說明</h2>' +
    (kid === "a" ? '<p id="mine"><strong>設成孩子自己的首頁：</strong><a href="mid/">🦊 中孩版</a> · <a href="big/">🚀 大孩版</a></p>' : "") +
    "<p>這裡的每一門課都是純靜態網頁，不登入也能用、不收集任何資料。首頁的 Google 登入只用來決定顯示誰的城市：瀏覽器只記住「中孩、大孩或爸媽」，不儲存帳號；沒登入時頁面會向 Google 載入登入按鈕。</p>" +
    "<p>小電視只播家長挑過的 YouTube 頻道；每天的觀看時間、家長密碼與隱藏的影片都存在這台裝置上（從小電視的「家長設定」修改）。學習進度存在孩子自己的瀏覽器裡，換一台裝置就會重新開始。</p>" +
    "<p>部分課程有動手實驗，請依課程內的安全提示由大人陪同進行。有鷹架的工地是還沒蓋好的題目；灰色上鎖的房子是留給大孩的。</p>" +
    '<div id="hashbox" hidden><p><strong>家長工具：</strong>輸入 email，下面會出現要貼進 KS_AUTH.ROLES 的代碼。只在這台裝置上計算，不會傳到任何地方。</p><input type="email" placeholder="name@example.com" autocomplete="off" aria-label="email"><code></code></div>' +
    '<p class="foot">Kids School · 為自己的孩子做的學習網站</p>';
  sheet.querySelector(".x").onclick = closeSheet;
  if (QS.get("hash") === "1"){
    var hb = sheet.querySelector("#hashbox"), hi = hb.querySelector("input"), ho = hb.querySelector("code"); hb.hidden = false;
    hi.addEventListener("input", function(){
      var m = normMail(hi.value);
      if (!m){ ho.textContent = ""; return; }
      if (!window.crypto || !crypto.subtle){ ho.textContent = "這個瀏覽器在這裡不能計算，請改用 https 或 localhost 開啟。"; return; }
      sha256(m).then(function(h){ if (normMail(hi.value) === m) ho.textContent = h; });
    });
  }
  sheet.classList.add("open"); hideHint();
}
document.getElementById("info").onclick = infoSheet;

// ---- 🎨 customise the city (the editor itself is assets/city-edit.js) ----
function rebuild(){ picked = null; fresh(); layout(); build(); renderChips(); apply(); }
window.KS_CITY = {
  KEY:CITY_KEY, profile:PROFILE, base:BASE, spr:SPR, palettes:PALETTES, kid:kid, hasCustom:hasCustom,
  clean:cleanCity, model:customCity,

  save:function(ov, keepTs){ ov = Object.assign({}, ov || {}); if (!keepTs) ov.ts = Date.now();
    ov = cleanCity(ov); if (ov) set(CITY_KEY, ov); else try { localStorage.removeItem(CITY_KEY); } catch(e){}
    rebuild(); return ov; },
  sheet:sheet, esc:esc, home:function(){ home(); },
  show:function(){ world.querySelectorAll(".bld.sel").forEach(function(b){ b.classList.remove("sel"); }); picked = null; sheet.classList.add("open"); hideHint(); },

};

  else { closeSheet(); sheet.innerHTML = '<button class="x" type="button" aria-label="關閉">✕</button><h2>🎨 自訂城市</h2><p>編輯器還沒載入，請重新整理一次再試。</p>';
    sheet.querySelector(".x").onclick = closeSheet; sheet.classList.add("open"); }
};

fresh(); layout(); build(); renderChips(); home(true); tick(); setInterval(tick, 15000);
if (QS.get("hash") === "1") infoSheet();
})();
