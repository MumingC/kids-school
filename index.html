:root{

  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;color:#fff}
.hud .eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--foam);opacity:.85}
.hud h1{margin:2px 0 0;font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.2;text-wrap:balance}
.hud .now{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.hud .now small{display:block;font-family:var(--body);font-size:13px;font-weight:500;opacity:.85;margin-top:6px}
.last{margin:10px 0 0;font-size:15px;color:var(--foam)}
.last a{display:inline-block;margin-left:4px;padding:4px 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:700;text-decoration:none}
a:focus-visible,.isl:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.chart{margin-top:12px;border-radius:22px;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 40%,var(--sea-light) 0%,var(--sea) 45%,var(--sea-deep) 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 10px 30px rgba(6,40,66,.35)}
.chart svg{display:block;width:100%;height:auto}
.isl{cursor:pointer;outline:none}
.isl .lift{transition:transform .25s}
.isl:hover .lift,.isl.sel .lift{transform:translateY(-8px)}
.isl .bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tile.locked{filter:grayscale(.9) opacity(.6)}
.tile.empty .top{stroke-dasharray:6 5}
.tile.pick .top{stroke:var(--coral);stroke-width:5}
.wave{stroke:var(--foam);stroke-width:2.5;fill:none;stroke-linecap:round;opacity:.45;animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.boat{transition:transform 1.1s cubic-bezier(.5,.1,.3,1);pointer-events:none}
.tag rect{fill:var(--paper)}
.tag text{font-family:var(--body);font-weight:900;font-size:20px;fill:var(--ink)}
.isl.sel .tag rect{fill:var(--sun)}
.emo{font-size:28px}
.emo.big{font-size:40px}
.tl{font-family:var(--body);font-weight:700;font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3.5px;stroke-linejoin:round}
svg.tall .tl{font-size:17px;stroke-width:4.5px}
svg.tall .tag text{font-size:24px}
.dock{margin-top:14px;background:var(--paper);border-radius:22px;padding:20px 22px;box-shadow:0 10px 30px rgba(6,40,66,.3);scroll-margin-top:12px}
.dock .eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
.dock h2{margin:4px 0 0;font-size:26px;font-weight:900;line-height:1.3;text-wrap:balance}
.dock .lead{margin:6px 0 0;color:var(--ink-soft);max-width:40em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.opt{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--paper-2);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.opt.pick{border-color:var(--coral)}
.opt h3{margin:0;font-size:18px;font-weight:900;line-height:1.35}
.opt p{margin:0;font-size:14.5px;color:var(--ink-soft)}
.opt .age{font-size:12.5px;font-weight:700;color:var(--leaf)}
.opt .go{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.opt.locked{opacity:.6}
.opt.empty{border-style:dashed;background:transparent}

.lockmsg{font-weight:700;font-size:14px;color:var(--ink-soft)}
.back{display:none;margin-top:16px;font-weight:700;font-size:14.5px;color:var(--sea-deep);text-decoration:none}
.mine{margin:14px 4px 0;color:var(--foam);font-size:14px}
.mine a{color:#fff;font-weight:700}
.note{margin:16px 0 0;background:rgba(255,253,246,.92);border-radius:16px;padding:14px 18px;font-size:14.5px;color:var(--ink-soft)}
.note strong{color:var(--ink)}
footer{margin-top:18px;text-align:center;color:var(--foam);font-size:13px;opacity:.85}
.plain{background:var(--paper);border-radius:16px;padding:16px 20px;margin-top:14px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0 0;font-size:15px;color:var(--foam)}
.who[hidden]{display:none}
.who button{font:inherit;font-weight:700;padding:4px 14px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.who button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.who .msg{flex-basis:100%;font-weight:700;color:#fff}
.plain input{font:inherit;width:100%;max-width:26em;padding:6px 10px;border:2px solid var(--line);border-radius:10px}
.plain code{display:block;margin-top:8px;overflow-wrap:anywhere;user-select:all}
@media (max-width:720px){.back{display:inline-block}}
@media (prefers-reduced-motion:reduce){.isl .bob,.wave{animation:none}.boat,.isl .lift{transition:none}}

    el("polygon", { points: pts([c[0], c[1], low(c[1]), low(c[0])]), fill: shade(col, .62) }, tg);
    el("polygon", { points: pts([c[1], c[2], low(c[2]), low(c[1])]), fill: shade(col, .72) }, tg);
    el("polygon", { points: pts([c[2], c[3], low(c[3]), low(c[2])]), fill: shade(col, .55) }, tg);
    el("polygon", { "class":"top", points: pts(c), fill: col, stroke: shade(col, .78), "stroke-width":"2", "stroke-linejoin":"round" }, tg);
    var emo = it ? it.emo : t.empty ? "🌱" : t.emo;
    if (emo){ var tx = el("text", { x: t.x, y: t.y + (it ? -1 : t.main ? 8 : 6), "text-anchor":"middle", "class":"emo" + (t.main ? " big" : "") }, tg); tx.textContent = emo; }
    if (it){
      var lb = el("text", { x: t.x, y: t.y + 17, "text-anchor":"middle", "class":"tl" }, tg); lb.textContent = (locked(it) ? "🔒" : "") + it.short;
      tg.setAttribute("tabindex", "0"); tg.setAttribute("role", "button"); tg.setAttribute("aria-label", it.title); tg.setAttribute("data-item", it.id);
      var pick = function(e){ e.stopPropagation(); select(is.id, it.id, true); };
      tg.addEventListener("click", pick);
      tg.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(e); } });
    }
  });
  var w = is.name.length * (layout === TALL ? 25 : 21) + 30, ty = maxY + R * K + D + 24;
  var tag = el("g", { "class":"tag" }, lift);
  el("rect", { x: cx - w / 2, y: ty - 22, width: w, height: 32, rx: 16 }, tag);
  var tt = el("text", { x: cx, y: ty + 1, "text-anchor":"middle" }, tag); tt.textContent = is.name;
  g._anchor = [minX - R - 4, cy + 34];
  g.addEventListener("click", function(){ select(is.id, null, true); });
  g.addEventListener("keydown", function(e){ if (e.target === g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); select(is.id, null, true); } });
  return g;
}

function render(){
  var next = NARROW.matches ? TALL : WIDE;
  if (next !== layout) boatAt = null;
  layout = next;
  svg.setAttribute("viewBox", "0 0 " + layout.w + " " + layout.h);
  svg.setAttribute("class", layout === TALL ? "tall" : "");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 46; i++){
    var x = rnd() * layout.w, y = rnd() * layout.h;
    el("path", { d: "M" + x + " " + y + " q8 -7 16 0 t16 0", "class":"wave", style:"animation-delay:" + (-rnd() * 7) + "s" }, svg);
  }
  var nodes = {};
  ISLANDS.map(function(is){ return { is: is, p: layout.pos[is.id] }; })
    .sort(function(a, b){ return a.p[1] - b.p[1]; })
    .forEach(function(o, i){ nodes[o.is.id] = drawIsland(o.is, o.p[0], o.p[1], i); });
  var boat = el("g", { "class":"boat" }, svg);
  var bt = el("text", { x:0, y:0, "text-anchor":"middle", "class":"emo big" }, boat); bt.textContent = "⛵";
  var who = el("text", { x:0, y:-34, "text-anchor":"middle", "class":"emo" }, boat); who.textContent = kid === "b" ? "🚀" : kid === "m" ? "🦊" : "👨‍👩‍👧‍👦";
  var a = nodes[selIsland]._anchor, to = "translate(" + a[0] + "px," + a[1] + "px)";
  if (boatAt && boatAt !== to){            // sail from the previous island
    boat.style.transform = boatAt;
    boat.getBoundingClientRect();
    boat.style.transform = to;
  } else boat.style.transform = to;
  boatAt = to;
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function btn(href, label, sub, cls, title){
  return '<a class="btn' + (cls ? " " + cls : "") + '" href="' + esc(href) + '"' + (title ? ' data-title="' + esc(title) + '"' : "") + ">" + label + "<small>" + sub + "</small></a>";
}
// TV minutes left today (same keys as tv/index.html)
var DEF = { s:20, m:40, b:60 };
function tvBtn(k, label, alt, ch){
  var st = get("kt.settings", {}), lim = st.limits || {}, used = get("kt.used", {});
  var L = lim[k] == null ? DEF[k] : lim[k], today = new Date().toLocaleDateString("sv");
  var u = used.date === today ? (used[k] || 0) : 0, left = Math.max(0, L * 60 - u);
  var sub = L <= 0 ? "不限時" : left <= 0 ? "今天看完了" : "還有 " + Math.ceil(left / 60) + " 分鐘";
  return btn("tv/?p=" + k + (ch ? "&c=" + encodeURIComponent(ch) : ""), label, sub, L > 0 && left <= 0 ? "out" : alt ? "alt" : "");
}
function dock(){
  var is = ISLANDS.filter(function(x){ return x.id === selIsland; })[0], its = items(is);
  var cards = its.map(function(it){
    var go, lk = locked(it);
    if (lk) go = '<span class="lockmsg">☁️ 長大一點再來探險</span>';
    else if (it.tv) go = (kid !== "b" ? tvBtn("m", "🦊 中孩") : "") + (kid !== "m" ? tvBtn("b", "🚀 大孩") : "") + tvBtn("s", "🐣 " + (kid === "a" ? "小小孩" : "帶小小孩看"), true);
    else if (it.six){
      var n = (get("kt.series", {})["The Six Minutes"]) || 1;
      go = btn("tv/?p=m", "▶ 聽故事", n > 1 ? "繼續聽第 " + n + " 集" : "從第 1 集開始") + btn("tv/?p=m&pick=1", "🔢 選集數", "自己挑一集", "alt");
    }
    else if (it.news) go = (kid !== "b" ? tvBtn("m", "🦊 中孩", false, "新聞超小號") : "") + (kid !== "m" ? tvBtn("b", "🚀 大孩", false, "新聞超小號") : "");
    else if (it.ext) go = btn(it.href, "⛵ 出發", "到均一的網站", "", "");
    else { var easy = kid === "m" && it.mHref; go = btn(easy ? it.mHref : it.href, "⛵ 出發", easy ? "簡單版" : "上島探險", "", it.title); }
    return '<article class="opt' + (lk ? " locked" : "") + (it.id === selItem ? " pick" : "") + '" data-item="' + it.id + '"><span class="age">' + esc(it.age) + "</span><h3>" + it.emo + " " + esc(it.title) +
      "</h3><p>" + esc(it.desc) + '</p><div class="go">' + go + "</div></article>";
  });
  (is.ideas || []).forEach(function(idea){
    cards.push('<article class="opt empty"><span class="age">🌱 還沒蓋</span><h3>' + esc(idea) + "</h3><p>這塊地還空著，之後會蓋在這裡。</p></article>");
  });
  document.getElementById("dock").innerHTML = '<div class="eyebrow">Island · ' + its.length + " 個地方可以去</div><h2>" + is.emblem + " " + esc(is.name) +
    '</h2><p class="lead">' + esc(is.lead) + '</p><div class="opts">' + cards.join("") + '</div><a class="back" href="#chart">🗺️ 回地圖</a>';
}
function select(island, item, byUser){
  selIsland = island; selItem = item; render(); dock();
  if (byUser && NARROW.matches){            // on a phone the dock is below the map
    var d = document.getElementById("dock");
    if (d.getBoundingClientRect().top > window.innerHeight * 0.6)
      d.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start" });
  }
}
// remember the last subject (per kid)
document.getElementById("dock").addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a.btn[data-title]") : null;
  if (a) set(LK, { href: a.getAttribute("href"), title: a.dataset.title, island: selIsland });
});
if (last && last.href && last.title){
  var p = document.getElementById("last"), la = document.createElement("a");
  la.href = last.href; la.textContent = last.title + " →";
  p.textContent = "上次去的地方："; p.appendChild(la); p.hidden = false;
}
if (kid !== "a"){
  document.getElementById("mine").hidden = true;
  document.title = NAME[kid].slice(3) + "的首頁 · Kids School";
}
// ---- optional Google sign-in: personalization only, not access control (config: KS_AUTH above) ----
function sha256(s){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function normMail(s){ return String(s || "").trim().toLowerCase(); }
function jwtEmail(tok){        // read the (unverified) payload of the ID token; nothing is sent anywhere
  var seg = String(tok).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  while (seg.length % 4) seg += "=";
  var bin = atob(seg), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return normMail(JSON.parse(new TextDecoder("utf-8").decode(bytes)).email);
}
(function(){
  if (!CID || qk != null) return;          // off, or an explicit ?k= page: no sign-in UI at all
  var box = document.getElementById("who"), roles = {};
  Object.keys(AUTH.ROLES || {}).forEach(function(h){ roles[h.toLowerCase()] = AUTH.ROLES[h]; });
  if (who){
    var lab = document.createElement("span"), out = document.createElement("button");
    lab.textContent = who === "p" ? "👨‍👩‍👧‍👦 爸爸媽媽：全部的島" : NAME[who] + "的海圖";
    out.type = "button"; out.textContent = "換人";
    out.addEventListener("click", function(){ try { localStorage.removeItem("ks.who"); } catch(e){} location.reload(); });
    box.appendChild(lab); box.appendChild(out); box.hidden = false;
    return;
  }
  var tip = document.createElement("span"), slot = document.createElement("span"), msg = document.createElement("span");
  tip.textContent = "登入就會變成你的海圖："; msg.className = "msg"; msg.setAttribute("role", "status");
  box.appendChild(tip); box.appendChild(slot); box.appendChild(msg);
  function onCredential(resp){
    var mail = "";
    try { mail = jwtEmail(resp.credential); } catch(e){}
    if (!mail || !window.crypto || !crypto.subtle){ msg.textContent = "登入沒有成功，再試一次看看。"; return; }
    sha256(mail).then(function(h){
      var role = roles[h];
      if (role === "m" || role === "b" || role === "p"){ set("ks.who", role); location.reload(); }
      else msg.textContent = "這個帳號還沒登記喔，先看全部的島。請爸爸媽媽幫你加上去！";
    }, function(){ msg.textContent = "登入沒有成功，再試一次看看。"; });
  }
  var s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client?hl=zh-TW"; s.async = true;
  s.onload = function(){
    try {
      google.accounts.id.initialize({ client_id: CID, callback: onCredential, auto_select: false });
      google.accounts.id.renderButton(slot, { type:"standard", theme:"outline", size:"medium", shape:"pill", text:"signin", locale:"zh_TW" });
      box.hidden = false;
    } catch(e){}
  };
  document.head.appendChild(s);            // if it cannot load (offline, blocked) the page just stays as it is
})();
// parent helper: ?hash=1 turns an email into the code for KS_AUTH.ROLES (computed on this device only)
if (QS.get("hash") === "1"){
  var hb = document.createElement("div"), hi = document.createElement("input"), ho = document.createElement("code");
  hb.className = "plain"; hb.id = "hashbox";
  hb.innerHTML = "<p><strong>家長工具：</strong>輸入 email，下面會出現要貼進 <code style=\"display:inline\">KS_AUTH.ROLES</code> 的代碼。只在這台裝置上計算，不會傳到任何地方。</p>";
  hi.type = "email"; hi.placeholder = "name@example.com"; hi.autocomplete = "off"; hi.setAttribute("aria-label", "email");
  hi.addEventListener("input", function(){
    var m = normMail(hi.value);
    if (!m){ ho.textContent = ""; return; }
    if (!window.crypto || !crypto.subtle){ ho.textContent = "這個瀏覽器在這裡不能計算，請改用 https 或 localhost 開啟。"; return; }
    sha256(m).then(function(h){ if (normMail(hi.value) === m) ho.textContent = h; });
  });
  hb.appendChild(hi); hb.appendChild(ho);
  document.getElementById("mine").parentNode.insertBefore(hb, document.getElementById("mine"));
}
function tick(){
  var d = new Date(), h = d.getHours();
  var g = h < 5 ? "夜深了，該睡覺囉" : h < 11 ? "早安" : h < 13 ? "午安" : h < 18 ? "下午好" : "晚安";
  document.getElementById("greet").textContent = (NAME[kid] ? NAME[kid] + "，" : "") + g + "！今天想去哪一座島？";
  document.getElementById("clock").textContent = d.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", hour12:false });
  document.getElementById("date").textContent = d.toLocaleDateString("zh-TW", { month:"long", day:"numeric", weekday:"long" });
}
NARROW.addEventListener("change", function(){ render(); });
window.addEventListener("pageshow", function(){ dock(); });   // refresh TV minutes after coming back
render(); dock(); tick(); setInterval(tick, 15000);
})();
