<style>
/* English level check: four bands (A1, A2, B1, B2), each with vocabulary, grammar, reading and listening.
   A band is passed at 65%; the test stops at the first band that is not passed. Items are original
   (not GEPT items); the bands map roughly onto GEPT 初級 / 中級 / 中高級. Results stay on this device unless the cloud (assets/ks-cloud.js) is on and the kid is signed in. */
:root{
  color-scheme:light;
  --ink:#1d2a3a; --ink-soft:#52627a; --paper:#fffaf0; --card:#ffffff; --line:#e3d9c3;
  --sun:#ffc93c; --go:#e4572e; --go-dark:#b9411f; --leaf:#3f9a5a; --sky:#3d7ea6; --bad:#c24a3a;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --en:"Nunito","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(#bfe6f5,#e9f6ef 340px) no-repeat,#e9f6ef;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top a{color:var(--ink);font-weight:700;text-decoration:none;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:14px}
.top .time{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-soft)}
.card{background:var(--card);border-radius:22px;padding:22px 22px 24px;box-shadow:0 8px 26px rgba(29,42,58,.13);border:2px solid #fff}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);font-weight:900;line-height:1.3;text-wrap:balance}
h2{margin:0 0 8px;font-size:22px;font-weight:900;line-height:1.35;text-wrap:balance}
p{margin:0 0 12px}
.soft{color:var(--ink-soft)}
.hero{display:flex;gap:16px;align-items:center}
.hero img{width:112px;height:112px;object-fit:contain;flex:none}
@media (max-width:480px){.hero{flex-direction:column;align-items:flex-start}.hero img{width:96px;height:96px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 18px}
.steps div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14.5px}
.steps b{display:block;font-size:16px}
.who{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.who button{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--ink)}
.who button.on{border-color:var(--ink);background:var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:900;font-size:18px;color:#fff;background:var(--go);border:0;border-radius:16px;padding:12px 26px;box-shadow:0 4px 0 var(--go-dark);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:15px;padding:8px 16px}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.bar{height:10px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.where{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px}
.kind{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:2px 12px;margin-bottom:10px;color:#fff;background:var(--sky)}
.kind.vocab{background:#8d7be0}.kind.grammar{background:#3d7ea6}.kind.reading{background:#d99a2b}.kind.listening{background:#4f9d5d}
.word{font-family:var(--en);font-size:clamp(30px,7vw,40px);font-weight:800;margin:4px 0 2px}
.ex{font-family:var(--en);font-size:17px;color:var(--ink-soft);margin-bottom:14px}
.stem{font-family:var(--en);font-size:21px;font-weight:700;line-height:1.5;margin:6px 0 16px}
.stem .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ink);margin:0 4px}
.q{font-size:18px;font-weight:700;margin:4px 0 12px}
.q.en{font-family:var(--en);font-size:19px}
.passage{font-family:var(--en);font-size:17px;line-height:1.75;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;max-height:46vh;overflow-y:auto}
.passage p{margin:0 0 10px}.passage p:last-child{margin:0}
.opts{display:grid;gap:10px}
.opts button{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;cursor:pointer;color:var(--ink);font-size:17px;line-height:1.45;display:flex;gap:10px;align-items:baseline}
.opts button.en{font-family:var(--en);font-size:18px}
.opts button .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font:800 13px var(--body)}
.opts button:hover{border-color:var(--ink-soft)}
.opts button.on{border-color:var(--ink);background:#fff4cc}
.opts button.dk{color:var(--ink-soft);font-size:15px;border-style:dashed}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.play{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.play button{width:64px;height:64px;border-radius:50%;border:0;background:var(--leaf);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #2b7240}
.play button:disabled{opacity:.45;cursor:default}
.play span{font-size:14px;color:var(--ink-soft);font-weight:700}
.warn{background:#fff1e8;border:2px solid #f5c3b0;border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:14px}

.big{font-size:clamp(34px,8vw,48px);font-weight:900;line-height:1.15;margin:4px 0}
.lvl{display:inline-block;background:var(--sun);border-radius:14px;padding:4px 14px;font-weight:900;margin-bottom:10px}
.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
@media (max-width:480px){table{font-size:13.5px}th,td{padding:6px 4px}}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
th:first-child,td:first-child{text-align:left}
td.good{color:var(--leaf);font-weight:800}td.mid{color:#b9801a;font-weight:800}td.low{color:var(--bad);font-weight:800}td.na{color:#aab}
textarea{width:100%;min-height:180px;font:17px/1.6 var(--en);border:2px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical}
.count{font-size:14px;color:var(--ink-soft);font-weight:700;text-align:right;margin-top:4px}
details{margin-top:14px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:800}
.wrong{font-size:14.5px;border-top:1px dashed var(--line);padding:8px 0}
.wrong:first-of-type{border-top:0}
.wrong .en{font-family:var(--en)}
.wrong .x{color:var(--bad);font-weight:700}.wrong .o{color:var(--leaf);font-weight:700}
.essay{white-space:pre-wrap;font-family:var(--en);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.hist{font-size:14.5px;margin-top:6px}
.cele{font-size:52px;line-height:1}
.cloud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#eef6fb;border:2px solid #cfe3ef;border-radius:14px;padding:8px 12px;font-size:14.5px;margin:0 0 14px}
.cloud.ok{background:#edf7ef;border-color:#cbe6d1}
.cloud .gbtn{min-height:32px}
.hist .tag{font-size:12px;color:var(--ink-soft)}
</style>
</head>

      (nb ? "下一個目標是「" + esc(nb.name.split(" · ")[1]) + "」（" + esc(nb.gept) + "）。" : "四關全過，已經超過這份測驗能測量的範圍了！") + "</p>" +
    (weak && weak[1] < .75 ? '<p class="soft">在最後一關裡，<b>' + KINDS[weak[0]] + "</b>答得最少，可以先從這裡加強。</p>" : "") +
    (old ? "" : '<div class="cloud" id="cstat" hidden></div>') +
    (rec.noVoice ? '<div class="warn">這次沒有英文語音，聽力沒有測到，結果可能偏高或偏低。</div>' : "") +
    '<div class="tbl"><table><thead><tr><th>關卡</th><th>字彙</th><th>文法</th><th>閱讀</th><th>聽力</th><th>合計</th></tr></thead><tbody>' +
    rec.bands.map(function(x){ return "<tr><td>" + x.id + " " + (x.pass ? "✅" : "❌") + "</td>" + pctCell(x.by, "vocab") + pctCell(x.by, "grammar") + pctCell(x.by, "reading") + pctCell(x.by, "listening") +
      "<td><b>" + Math.round(x.ok / Math.max(1, x.n) * 100) + "%</b></td></tr>"; }).join("") +
    "</tbody></table></div>" +
    '<p class="soft" style="font-size:14px">每一關答對 65% 以上算過關。這是 Kids School 自己出的題目，只用來估計大概落在哪一級，不是正式的全民英檢成績。</p>' +
    "<details><summary>給爸爸媽媽：答錯和選「不知道」的題目</summary>" +
    rec.bands.map(function(x){ return x.wrong.length ? "<p style=\"margin:10px 0 2px\"><b>" + x.id + "</b></p>" + x.wrong.map(function(w){
      return '<div class="wrong"><span class="kind ' + w.kind + '" style="margin:0 6px 0 0;font-size:11px;padding:0 8px">' + KINDS[w.kind] + '</span><span class="en">' + esc(w.q) + '</span><br>選了：<span class="x">' + (w.a ? esc(w.a) : "不知道") + '</span>　答案：<span class="o">' + esc(w.r) + "</span></div>"; }).join("") : ""; }).join("") +
    "</details>" +
    (rec.essay ? "<details open><summary>寫作（" + words + " 個字）</summary><p class=\"soft\" style=\"margin:6px 0 0;font-size:14px\">題目：" + esc(WRITE) + '</p><div class="essay" lang="en">' + esc(rec.essay) + "</div></details>" : "") +
    '<div class="row" style="margin-top:18px"><a class="btn" href="../../">🏙️ 回城市</a><button class="btn alt small" type="button" id="again">' + (old ? "回測驗首頁" : "再做一次") + "</button></div>";
  app.querySelector("#again").onclick = start;
  if (!old) resultCloud(rec);
  window.scrollTo(0, 0);
}
start();
})();
</script>
</body>
</html>
