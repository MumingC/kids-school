<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kids School 城市（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  --ink:#1d2a3a; --ink-soft:#52627a; --paper:#fffaf0; --line:#e3d9c3; --sun:#ffc93c; --go:#e4572e;
  --sky1:#bfe6f5; --sky2:#e9f6ef;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--sky2);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky1),var(--sky2) 55%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#city{display:block;width:100%;height:100%}
.bld{cursor:pointer;outline:none}
.bld .top{transition:filter .15s}
.bld:hover .top,.bld:focus-visible .top{filter:brightness(1.12)}
.bld.sel .ring{opacity:1}
.ring{opacity:0;fill:none;stroke:var(--sun);stroke-width:6;stroke-linejoin:round}
.lab{font:700 15px var(--body);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.emo{font-size:40px;pointer-events:none}
.dname{font:900 22px var(--body);fill:#fff;pointer-events:none}
.plot .lab{fill:var(--ink-soft);font-weight:500;font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .bld.sel .body{animation:hop .5s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
}

.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;display:flex;flex-direction:column;gap:8px}
.hud > *{pointer-events:auto}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.title small{display:block;font-weight:500;font-size:12px;opacity:.85}
.clock{margin-left:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:700 14px var(--body);color:var(--ink);background:rgba(255,255,255,.94);border:2px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chips button.on{border-color:var(--ink);background:var(--sun)}
.zoom{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.95);font:900 22px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(29,42,58,.88);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}

.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);background:var(--paper);border-radius:22px 22px 0 0;border:2px solid var(--line);border-bottom:0;padding:16px 18px max(18px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.22);transition:transform .25s ease}
.sheet.open{transform:translate(-50%,0)}
.sheet .x{position:absolute;right:10px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:#efe6d0;font-size:18px;cursor:pointer}
.sheet .where{font-weight:700;font-size:13px;color:var(--ink-soft)}
.sheet h2{margin:2px 40px 2px 0;font-size:22px;font-weight:900}
.sheet .age{display:inline-block;font-size:12px;font-weight:700;background:#efe6d0;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.sheet p{margin:4px 0 12px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.go{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;text-align:center;text-decoration:none;background:var(--go);color:#fff;font-weight:900;font-size:17px;border-radius:14px;padding:10px 12px}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.9}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.lockmsg{font-weight:700;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="stage"><svg id="city" role="group" aria-label="Kids School 城市地圖"><g id="world"></g></svg></div>

<div class="hud">
  <div class="bar">
    <div class="title">🏙️ Kids School 城<small id="greet">想去哪一區？</small></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="chips" id="chips" aria-label="直接飛到某一區"></div>
</div>
<div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zhome" aria-label="看整座城市">🏠</button></div>
<div class="hint" id="hint">👆 拖著地圖走走看，點房子進去</div>
<div class="sheet" id="sheet" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* The city is generated from DISTRICTS. To grow it: add an item to a district (a new building),
   add an idea (a construction site), or add a district (it takes the next free block; when the
   3 x 2 blocks are full, add a column and the map gets wider). */
var kid = new URLSearchParams(location.search).get("k");
var DISTRICTS = [
  { id:"science", name:"科學區", emo:"🔬", roof:"#8d7be0", wall:"#c9c0f4", ground:"#dcd6f7", deco:["🔭","🧪"],
    items:[
      { emo:"🚀", short:"火箭", title:"從地面到軌道", age:"小三起點", desc:"12 關火箭課程，每一關都有一個真的在算物理的互動模擬器。", href:"rocket/", h:150 },
      { emo:"⏱️", short:"相對論", title:"時間變慢實驗室", age:"小二起點", desc:"跟光比賽跑到月球，用「光做的時鐘」看懂時間為什麼會變慢。", href:"relativity/" },
      { emo:"⚛️", short:"核分裂", title:"核分裂實驗室", age:"大孩", only:"b", desc:"8 站，從原子結構到連鎖反應，最後看反應爐與核彈的分岔。", href:"fission/" },
      { emo:"📐", short:"均一", title:"均一教育平台", age:"數學 · 自然 · 各年級", desc:"學校也在用的免費學習網站。會離開 Kids School。", href:"https://www.junyiacademy.org/" }
    ], ideas:[] },
  { id:"history", name:"歷史老城", emo:"🏛️", roof:"#b5653a", wall:"#edc9a4", ground:"#f1dfc4", deco:["🏺","⛲"],
    items:[
      { emo:"🗺️", short:"二戰", title:"小小歷史家：二次世界大戰", age:"兩種難度", desc:"會動的戰爭地圖、歷史大軸線、老照片與武器圖鑑。", href:"ww2/", mHref:"ww2/kids.html" }
    ], ideas:["🏯 臺灣的故事","🛕 古文明"] },
  { id:"computer", name:"電腦園區", emo:"💻", roof:"#3d7ea6", wall:"#b9dcee", ground:"#d5e8f2", deco:["📡","💡"],
    items:[
      { emo:"🤖", short:"AI 的故事", title:"AI 是怎麼長大的？", age:"親子共讀", desc:"從 AlphaGo 回到圖靈、感知器與 ELIZA，用人物故事看 AI 的歷史。", href:"ai-history/", h:130 }
    ], ideas:["⌨️ 寫程式入門","🔐 密碼與暗號"] },
  { id:"nature", name:"自然公園", emo:"🌿", roof:"#4f9d5d", wall:"#cfe8c4", ground:"#bfe3a8", deco:["🌳","🦋","🌲"],
    items:[], ideas:["🦖 恐龍與化石","🐛 昆蟲觀察","🌦️ 天氣與颱風"] },
  { id:"geo", name:"地理港口", emo:"🌍", roof:"#d99a2b", wall:"#f6e2ae", ground:"#f3e7c0", deco:["⚓","🌴"],
    items:[
      { emo:"🕵️", short:"小偵探", title:"環球小偵探", age:"小三到小六", desc:"跟著線索追怪盜飛遍 38 座城市，認國旗、看文化圖鑑。", href:"detective/" },
      { emo:"🌉", short:"河流城市", title:"台北的水上公路", age:"9 站專題", desc:"台北能不能有通勤用的水上公路？最後當市長做選擇。", href:"river-city/", mHref:"river-city/kids.html" },
      { emo:"🧳", short:"旅行規劃", title:"旅行規劃師", age:"兩種難度 · 8 站", desc:"學會排行程，最後幫全家排出淡水一日遊。", href:"trip-planner/", mHref:"trip-planner/?lv=easy" }
    ], ideas:["🗾 臺灣地圖"] },
  { id:"fun", name:"遊樂街", emo:"🎪", roof:"#e4572e", wall:"#fbd0c1", ground:"#fde3d6", deco:["🎡","🎈"],
    items:[
      { emo:"📺", short:"小電視", title:"家庭小電視", age:"每天限時", desc:"爸爸媽媽挑過的頻道。點自己的名字進去。", tv:true, h:120 },
      { emo:"📡", short:"小新聞", title:"新聞超小號", age:"小公視 · 每週五更新", desc:"給小朋友看的新聞，每集大約 15 分鐘。會算進小電視的時間。", news:true },
      { emo:"📻", short:"六分鐘", title:"The Six Minutes", age:"English · 每集約 6 分鐘", hide:"b", desc:"一集一集往下聽的英文廣播劇。", six:true },
      { emo:"🏘️", short:"小小村長", title:"Village Chief 小小村長", age:"大孩 · 英文介面", only:"b", desc:"六角格地圖的經濟策略遊戲：探索、建城、做買賣。", href:"village-chief/" }
    ], ideas:[] }
];

/* ---------- layout: blocks of 5 x 3 tiles with one-tile roads between ---------- */
var TW = 120, TH = 60, M = 2, BW = 5, BD = 3, COLS = 3;
var ROWS = Math.ceil(DISTRICTS.length / COLS);
var X1 = M + COLS * (BW + 1) - 1;            // east road x
var Y1 = M + ROWS * (BD + 1) - 1;            // front road y
var RIVER = Y1 + 2, GX = X1 + 8, GY = RIVER + 3;
var LOTS = [[0,0],[2,0],[4,0],[0,2],[2,2],[4,2]];
DISTRICTS.forEach(function(d, i){ d.ox = M + (i % COLS) * (BW + 1); d.oy = M + Math.floor(i / COLS) * (BD + 1); });

function iso(x, y){ return [(x - y) * TW / 2, (x + y) * TH / 2]; }
function pts(a){ return a.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
var NS = "http://www.w3.org/2000/svg";
function el(n, at, parent, text){ var e = document.createElementNS(NS, n); for (var k in at) e.setAttribute(k, at[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function rnd(x, y){ var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function shade(hex, f){ var n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  function c(v){ return Math.max(0, Math.min(255, Math.round(v * f))); } return "rgb(" + c(r) + "," + c(g) + "," + c(b) + ")"; }

function tileType(x, y){
  if (y === RIVER || y === RIVER + 1) return "river";
  var onX = x >= M - 1 && x <= X1, onY = y >= M - 1 && y <= Y1;
  if (onY && onX && ((x - (M - 1)) % (BW + 1) === 0 || (y - (M - 1)) % (BD + 1) === 0)) return "road";
  for (var i = 0; i < DISTRICTS.length; i++){ var d = DISTRICTS[i];
    if (x >= d.ox && x < d.ox + BW && y >= d.oy && y < d.oy + BD) return d; }
  if (x > X1 + 1 && x < GX - 1 && y >= M && y < Y1) return "plot";
  return "grass";
}

var world = document.getElementById("world"), things = [];
function tile(x, y, fill, stroke, extra){
  var a = Object.assign({ points:pts([iso(x,y), iso(x+1,y), iso(x+1,y+1), iso(x,y+1)]), fill:fill, stroke:stroke || "none", "stroke-width":1 }, extra || {});
  return el("polygon", a, world);
}
function items(d){ return d.items.filter(function(it){ return !(it.hide && it.hide === kid); }); }
function locked(it){ return it.only === "b" && kid === "m"; }

function build(){
  var x, y;
  for (y = -1; y < GY; y++) for (x = -1; x < GX; x++){
    var t = tileType(x, y);
    if (t === "river") tile(x, y, (x + y) % 2 ? "#7cc4e8" : "#86cbed");
    else if (t === "road") tile(x, y, "#9aa3ad", "#8a939d");
    else if (t === "plot") tile(x, y, "#e6ecd9", "#b9c4a2", { "stroke-dasharray":"6 6" });
    else if (t === "grass"){ tile(x, y, (x + y) % 2 ? "#a8d68c" : "#a1d184");
      if (rnd(x, y) > .8 && y !== RIVER - 1) things.push({ z:x + y, draw:deco.bind(null, x, y, rnd(y, x) > .5 ? "🌳" : "🌲", 34) }); }
    else tile(x, y, t.ground, shade(t.ground, .9));
  }
  DISTRICTS.forEach(function(d){
    var list = items(d).map(function(it){ return { it:it }; }).concat(d.ideas.map(function(s){ return { idea:s }; }));
    LOTS.forEach(function(L, i){
      var x = d.ox + L[0], y = d.oy + L[1], e = list[i];
      if (!e) { if (d.deco[i % d.deco.length]) things.push({ z:x + y, draw:deco.bind(null, x, y, d.deco[i % d.deco.length], 36) }); return; }
      things.push({ z:x + y, draw:(e.it ? building : site).bind(null, d, e.it || e.idea, x, y, i) });
    });
    for (var k = 0; k < BW; k += 4) things.push({ z:d.ox + k + d.oy + 1, draw:deco.bind(null, d.ox + k, d.oy + 1, d.deco[k % d.deco.length], 30) });
    things.push({ z:999, draw:sign.bind(null, d) });
  });
  // the next block to be built, and things that move
  things.push({ z:X1 + 5 + M + 2, draw:function(){ var p = iso(X1 + 4.5, M + 2.5);
    el("text", { x:p[0], y:p[1] - 8, "text-anchor":"middle", "class":"emo" }, world, "🚧");
    el("text", { x:p[0], y:p[1] + 22, "text-anchor":"middle", "class":"lab" }, world, "城市還在長大：下一區會蓋在這裡"); } });
  things.sort(function(a, b){ return a.z - b.z; }).forEach(function(t){ t.draw(); });
  mover("⛵", iso(-1, RIVER + 1), iso(GX, RIVER + 1), 60);
  mover("🚌", iso(M - 1, Y1 + .55), iso(X1 + 1, Y1 + .55), 26);
}
function deco(x, y, e, size){ var p = iso(x + .5, y + .5); el("text", { x:p[0], y:p[1] + 6, "text-anchor":"middle", "font-size":size, "pointer-events":"none" }, world, e); }
function mover(e, a, b, sec){
  var t = el("text", { "font-size":34, "text-anchor":"middle", "pointer-events":"none" }, world, e);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ t.setAttribute("x", (a[0] + b[0]) / 2); t.setAttribute("y", (a[1] + b[1]) / 2); return; }
  el("animateTransform", { attributeName:"transform", type:"translate", from:a.join(" "), to:b.join(" "), dur:sec + "s", repeatCount:"indefinite" }, t);
}
function sign(d){
  var p = iso(d.ox + BW / 2, d.oy + 1.62), w = d.name.length * 24 + 64;
  var g = el("g", { "pointer-events":"none" }, world);
  el("rect", { x:p[0] - w / 2, y:p[1] - 20, width:w, height:36, rx:18, fill:d.roof, stroke:"#fff", "stroke-width":3 }, g);
  el("text", { x:p[0], y:p[1] + 6, "text-anchor":"middle", "class":"dname" }, g, d.emo + " " + d.name);
}
function box(g, x, y, h, inset, roof, wall){
  var a = iso(x + inset, y + inset), b = iso(x + 1 - inset, y + inset), c = iso(x + 1 - inset, y + 1 - inset), dd = iso(x + inset, y + 1 - inset);
  function up(p){ return [p[0], p[1] - h]; }
  el("polygon", { points:pts([dd, c, up(c), up(dd)]), fill:shade(wall, .82) }, g);
  el("polygon", { points:pts([c, b, up(b), up(c)]), fill:wall }, g);
  // windows on both faces
  for (var r = 0; r < Math.floor(h / 34); r++) for (var k = 0; k < 2; k++){
    var f = .25 + k * .5, yy = h - 22 - r * 34;
    var L = [dd[0] + (c[0] - dd[0]) * f, dd[1] + (c[1] - dd[1]) * f - yy], R = [c[0] + (b[0] - c[0]) * f, c[1] + (b[1] - c[1]) * f - yy];
    el("rect", { x:L[0] - 6, y:L[1] - 8, width:12, height:14, rx:2, fill:"#fff8d6", opacity:.85, transform:"skewY(26.57)", "transform-origin":L[0] + "px " + L[1] + "px" }, g);
    el("rect", { x:R[0] - 6, y:R[1] - 8, width:12, height:14, rx:2, fill:"#fff8d6", opacity:.95, transform:"skewY(-26.57)", "transform-origin":R[0] + "px " + R[1] + "px" }, g);
  }
  el("polygon", { points:pts([a, b, c, dd].map(up)), fill:roof, "class":"top" }, g);
  el("polygon", { points:pts([a, b, c, dd].map(up)), "class":"ring" }, g);
  return { top:up(iso(x + .5, y + .5)), front:c };
}
function building(d, it, x, y, i){
  var lk = locked(it), h = it.h || 70 + Math.round(rnd(x, y) * 40);
  var g = el("g", { "class":"bld", tabindex:0, role:"button", "aria-label":it.title + (lk ? "（長大一點再來）" : ""), "data-d":d.id, "data-i":i }, world);
  var body = el("g", { "class":"body" }, g);
  var o = box(body, x, y, h, .12, lk ? "#aeb6c2" : d.roof, lk ? "#dfe3e8" : d.wall);
  el("text", { x:o.top[0], y:o.top[1] + 12, "text-anchor":"middle", "class":"emo" }, body, lk ? "☁️" : it.emo);
  el("text", { x:o.front[0], y:o.front[1] + 20, "text-anchor":"middle", "class":"lab" }, g, (lk ? "🔒 " : "") + it.short);
  g._d = d; g._it = it;
}
function site(d, idea, x, y){
  var g = el("g", { "class":"plot" }, world), c = iso(x + .5, y + .5), f = iso(x + .88, y + .88);
  el("polygon", { points:pts([iso(x+.12,y+.12), iso(x+.88,y+.12), iso(x+.88,y+.88), iso(x+.12,y+.88)]), fill:"#fff", "fill-opacity":.55, stroke:shade(d.roof, .9), "stroke-width":2.5, "stroke-dasharray":"7 6" }, g);
  el("text", { x:c[0], y:c[1] + 8, "text-anchor":"middle", "font-size":28, "pointer-events":"none" }, g, "🏗️");
  el("text", { x:f[0], y:f[1] + 20, "text-anchor":"middle", "class":"lab" }, g, idea);
}

/* ---------- camera: drag to pan, wheel / pinch / buttons to zoom ---------- */
var stage = document.getElementById("stage"), cam = { x:0, y:0, s:1 }, ptrs = {}, moved = 0, pinch = 0, anim = 0;
var B0 = iso(-1, GY), B1 = iso(GX, -1), BY0 = iso(-1, -1)[1], BY1 = iso(GX, GY)[1];
function apply(){
  cam.s = Math.max(.3, Math.min(1.8, cam.s));
  cam.x = Math.max(B0[0], Math.min(B1[0], cam.x)); cam.y = Math.max(BY0, Math.min(BY1, cam.y));
  world.setAttribute("transform", "translate(" + (stage.clientWidth / 2 - cam.x * cam.s) + " " + (stage.clientHeight / 2 - cam.y * cam.s) + ") scale(" + cam.s + ")");
}
function fly(x, y, s){
  cancelAnimationFrame(anim); var a = { x:cam.x, y:cam.y, s:cam.s }, t0 = performance.now();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ cam.x = x; cam.y = y; cam.s = s; return apply(); }
  (function step(now){ var k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    cam.x = a.x + (x - a.x) * e; cam.y = a.y + (y - a.y) * e; cam.s = a.s + (s - a.s) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); })(t0);
}
function home(now){
  var c = iso((M - 1 + X1 + 1) / 2, (M - 1 + RIVER) / 2), w = (X1 - M + 2 + RIVER - M + 2) * TW / 2;
  var s = Math.min(1, stage.clientWidth / (w * .8)); s = Math.max(s, .42);
  if (now){ cam.x = c[0]; cam.y = c[1]; cam.s = s; apply(); } else fly(c[0], c[1], s);
}
function zoomAt(f, px, py){
  var wx = (px - stage.clientWidth / 2) / cam.s + cam.x, wy = (py - stage.clientHeight / 2) / cam.s + cam.y;
  cam.s = Math.max(.3, Math.min(1.8, cam.s * f));
  cam.x = wx - (px - stage.clientWidth / 2) / cam.s; cam.y = wy - (py - stage.clientHeight / 2) / cam.s; apply();
}
stage.addEventListener("pointerdown", function(e){ ptrs[e.pointerId] = [e.clientX, e.clientY]; moved = 0; cancelAnimationFrame(anim);
  var k = Object.keys(ptrs); if (k.length === 2) pinch = dist(); });
stage.addEventListener("pointermove", function(e){
  var p = ptrs[e.pointerId]; if (!p) return;
  var dx = e.clientX - p[0], dy = e.clientY - p[1], k = Object.keys(ptrs);
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (k.length === 2){ var d = dist(); if (pinch) zoomAt(d / pinch, (ptrs[k[0]][0] + ptrs[k[1]][0]) / 2, (ptrs[k[0]][1] + ptrs[k[1]][1]) / 2); pinch = d; moved = 99; return; }
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6){ if (!stage.classList.contains("drag")){ stage.classList.add("drag"); try { stage.setPointerCapture(e.pointerId); } catch(_){} hideHint(); }
    cam.x -= dx / cam.s; cam.y -= dy / cam.s; apply(); }
});
function up(e){ delete ptrs[e.pointerId]; pinch = 0; stage.classList.remove("drag"); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
function dist(){ var k = Object.keys(ptrs); return Math.hypot(ptrs[k[0]][0] - ptrs[k[1]][0], ptrs[k[0]][1] - ptrs[k[1]][1]) || 1; }
stage.addEventListener("wheel", function(e){ e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive:false });
document.getElementById("zin").onclick = function(){ zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2); };
document.getElementById("zout").onclick = function(){ zoomAt(.8, stage.clientWidth / 2, stage.clientHeight / 2); };
document.getElementById("zhome").onclick = function(){ closeSheet(); home(); };
addEventListener("resize", apply);
function hideHint(){ document.getElementById("hint").classList.add("off"); }

/* ---------- picking a building ---------- */
var sheet = document.getElementById("sheet");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function btn(href, label, sub, cls){ return '<a class="btn' + (cls ? " " + cls : "") + '" href="' + esc(href) + '">' + label + "<small>" + sub + "</small></a>"; }
function pick(g){
  var d = g._d, it = g._it, go;
  world.querySelectorAll(".bld.sel").forEach(function(b){ b.classList.remove("sel"); }); g.classList.add("sel");
  if (locked(it)) go = '<span class="lockmsg">☁️ 長大一點再來探險</span>';
  else if (it.tv) go = (kid !== "b" ? btn("tv/?p=m", "🦊 中孩", "進小電視") : "") + (kid !== "m" ? btn("tv/?p=b", "🚀 大孩", "進小電視") : "") + btn("tv/?p=s", "🐣 小小孩", "一起看", "alt");
  else if (it.news) go = (kid !== "b" ? btn("tv/?p=m&c=" + encodeURIComponent("新聞超小號"), "🦊 中孩", "看新聞") : "") + (kid !== "m" ? btn("tv/?p=b&c=" + encodeURIComponent("新聞超小號"), "🚀 大孩", "看新聞") : "");
  else if (it.six) go = btn("tv/?p=m", "▶ 聽故事", "接著聽") + btn("tv/?p=m&pick=1", "🔢 選集數", "自己挑一集", "alt");
  else { var easy = kid === "m" && it.mHref; go = btn(easy ? it.mHref : it.href, "🚪 進去", easy ? "簡單版" : "開始探險"); }
  sheet.innerHTML = '<button class="x" aria-label="關閉">✕</button><div class="where">' + d.emo + " " + esc(d.name) + '</div><h2>' + it.emo + " " + esc(it.title) +
    '</h2><span class="age">' + esc(it.age) + "</span><p>" + esc(it.desc) + '</p><div class="go">' + go + "</div>";
  sheet.classList.add("open"); sheet.querySelector(".x").onclick = closeSheet; hideHint();
  var bb = g.getBBox(); fly(bb.x + bb.width / 2, bb.y + bb.height / 2 + 70 / Math.max(cam.s, .8), Math.max(cam.s, .8));
}
function closeSheet(){ sheet.classList.remove("open"); world.querySelectorAll(".bld.sel").forEach(function(b){ b.classList.remove("sel"); }); }
world.addEventListener("click", function(e){ if (moved > 6) return; var g = e.target.closest(".bld"); if (g) pick(g); else closeSheet(); });
world.addEventListener("keydown", function(e){ var g = e.target.closest(".bld"); if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(g); } });
stage.addEventListener("click", function(e){ if (e.target === stage || e.target.id === "city") closeSheet(); });

/* ---------- HUD ---------- */
var chips = document.getElementById("chips");
chips.innerHTML = DISTRICTS.map(function(d){ return '<button data-d="' + d.id + '">' + d.emo + " " + d.name + "</button>"; }).join("");
chips.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
  var d = DISTRICTS.filter(function(x){ return x.id === b.dataset.d; })[0], c = iso(d.ox + BW / 2, d.oy + BD / 2);
  chips.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
  closeSheet(); hideHint(); fly(c[0], c[1] - 20, Math.min(1.05, stage.clientWidth / 560)); });
function tick(){ var n = new Date(), h = n.getHours();
  document.getElementById("clock").textContent = ("0" + h).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
  document.getElementById("greet").textContent = (h < 11 ? "早安" : h < 18 ? "午安" : "晚安") + "！" + (kid === "m" ? "🦊 中孩，" : kid === "b" ? "🚀 大孩，" : "") + "想去哪一區？"; }
tick(); setInterval(tick, 20000);

build(); home(true);
})();
</script>
</body>
