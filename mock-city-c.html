<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kids School 大街（試作 C）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="mock-city.css">
<style>
#stage{background:linear-gradient(#8fd0f2,#dff3fb 62%)}
#stage.night{background:linear-gradient(#141c3a,#3a3f73 62%)}
.night .lab{fill:#fff;stroke:#1d2a3a}
.night .lab.soft{fill:#dfe6f5}
</style>
</head>
<body>
<div id="stage"><svg id="city" role="group" aria-label="Kids School 大街"><g id="far"></g><g id="world"></g></svg></div>
<script src="mock-city-common.js"></script>
<script>
(function(){
"use strict";
/* Version C: one long street seen from the side. Each district is a stretch of the street and each
   subject is a building, so the street simply gets longer as content is added. The sky follows the clock. */
var K = window.KS, el = K.el, D = K.DISTRICTS, world = document.getElementById("world"), far = document.getElementById("far"), stage = document.getElementById("stage");
var VH = 700, G = 540, STEP = 205, hr = new Date().getHours(), night = hr >= 18 || hr < 6;
stage.classList.toggle("night", night);
K.hud("🛣️ Kids School 大街", "👈 往左右拖，沿著大街走走看 👉");

// lay the street out
var x = 50;
D.forEach(function(d){ d.x0 = x; d.lots = K.lots(d); x += 170 + Math.max(1, d.lots.length) * STEP + 60; d.x1 = x; x += 70; });
var END = x, W = END + 900;

// sky things and far hills (they move slower than the street)
var sky = el("g", { "pointer-events":"none" }, far);
for (var i = 0; i < 40; i++){
  if (night) el("circle", { cx:K.rnd(i, 1) * W, cy:K.rnd(i, 2) * 300, r:1.5 + K.rnd(i, 3) * 2, fill:"#fff", opacity:.8 }, sky);
  else if (i < 14) el("text", { x:K.rnd(i, 1) * W, y:70 + K.rnd(i, 2) * 190, "font-size":50 + K.rnd(i, 3) * 40, opacity:.9 }, sky, "☁️");
}
el("text", { x:300, y:250, "font-size":80 }, sky, night ? "🌙" : "☀️");
var hills = el("g", { "pointer-events":"none" }, far);
for (i = -2; i < W / 420 + 2; i++) el("ellipse", { cx:i * 420 + 200, cy:G + 30, rx:330, ry:150 + K.rnd(i, 9) * 110, fill:night ? "#2c3a5e" : "#a9d6a0" }, hills);
for (i = -2; i < W / 300 + 2; i++) el("ellipse", { cx:i * 300 + 90, cy:G + 40, rx:230, ry:90 + K.rnd(i, 5) * 60, fill:night ? "#24304f" : "#8fc98a" }, hills);

// ground: grass, pavement, road
el("rect", { x:-2000, y:G, width:W + 4000, height:400, fill:night ? "#2f4a3a" : "#8fcf7a" }, world);
D.forEach(function(d){ el("rect", { x:d.x0 - 30, y:G, width:d.x1 - d.x0 + 60, height:58, rx:10, fill:night ? K.shade(d.ground, .55) : d.ground }, world); });
el("rect", { x:-2000, y:G + 58, width:W + 4000, height:84, fill:night ? "#3b4252" : "#8d96a3" }, world);
el("path", { d:"M-2000 " + (G + 100) + " H" + (W + 2000), stroke:"#fff", "stroke-opacity":.75, "stroke-width":5, "stroke-dasharray":"34 30", fill:"none" }, world);

var WIN = night ? "#ffe08a" : "#eaf6ff";
function tower(g, cx, w, h, d, kind, lk){
  var roof = lk ? "#aeb6c2" : d.roof, wall = lk ? "#e3e7ec" : d.wall, top = G - h, body = el("g", { "class":"body" }, g), c, r;
  el("rect", { x:cx - w / 2, y:top, width:w, height:h, fill:night ? K.shade(wall, .7) : wall, stroke:K.shade(wall, .6), "stroke-width":3 }, body);
  for (r = 0; r < Math.floor((h - 150) / 46); r++) for (c = 0; c < 3; c++)
    el("rect", { x:cx - w / 2 + 20 + c * ((w - 40 - 26) / 2), y:top + 112 + r * 46, width:26, height:30, rx:4, fill:WIN, opacity:night && K.rnd(cx + c, r) > .7 ? .25 : 1 }, body);
  el("rect", { x:cx - 20, y:G - 56, width:40, height:56, rx:6, fill:K.shade(roof, .75) }, body);
  var st = { fill:roof, stroke:K.shade(roof, .7), "stroke-width":3, "stroke-linejoin":"round" };
  if (kind === 0){ el("path", Object.assign({ d:"M" + (cx - w / 2 - 8) + " " + top + " A" + (w / 2 + 8) + " 62 0 0 1 " + (cx + w / 2 + 8) + " " + top + " Z" }, st), body); }
  else if (kind === 1){ el("path", Object.assign({ d:"M" + (cx - w / 2 - 14) + " " + top + " L" + cx + " " + (top - 58) + " L" + (cx + w / 2 + 14) + " " + top + " Z" }, st), body); }
  else if (kind === 2){ el("rect", Object.assign({ x:cx - w / 2 - 8, y:top - 16, width:w + 16, height:18, rx:4 }, st), body);
    el("path", { d:"M" + (cx + 34) + " " + (top - 16) + " V" + (top - 74), stroke:K.shade(roof, .7), "stroke-width":4 }, body); el("circle", { cx:cx + 34, cy:top - 78, r:6, fill:"#ff5d5d" }, body); }
  else if (kind === 4){ el("path", Object.assign({ d:"M" + (cx - w / 2 - 10) + " " + top + " L" + (cx - w / 4) + " " + (top - 44) + " L" + cx + " " + top + " L" + (cx + w / 4) + " " + (top - 44) + " L" + (cx + w / 2 + 10) + " " + top + " Z" }, st), body); }
  else { for (c = 0; c < 6; c++) el("path", { d:"M" + (cx - w / 2 - 12 + c * (w + 24) / 6) + " " + (top - 4) + " h" + (w + 24) / 6 + " l-6 30 h-" + ((w + 24) / 6 - 12) + " Z", fill:c % 2 ? "#fff" : roof, stroke:K.shade(roof, .7), "stroke-width":2 }, body); }
  el("circle", { cx:cx, cy:top + 58, r:38, fill:"#fff", stroke:K.shade(wall, .6), "stroke-width":3 }, body);
  el("rect", { x:cx - w / 2 - 8, y:top - 66, width:w + 16, height:h + 70, rx:14, "class":"ring" }, body);
  return top;
}
D.forEach(function(d, di){
  // district gate
  var gx = d.x0 + 60, w = d.name.length * 26 + 76;
  el("path", { d:"M" + gx + " " + G + " V" + (G - 210), stroke:K.shade(d.roof, .7), "stroke-width":10, "stroke-linecap":"round" }, world);
  el("rect", { x:gx - 10, y:G - 262, width:w, height:52, rx:12, fill:d.roof, stroke:"#fff", "stroke-width":4 }, world);
  el("text", { x:gx - 10 + w / 2, y:G - 226, "text-anchor":"middle", "class":"dname" }, world, d.emo + " " + d.name);
  d.lots.forEach(function(e, k){
    var cx = d.x0 + 170 + k * STEP + STEP / 2;
    el("text", { x:cx + STEP / 2, y:G + 4, "text-anchor":"middle", "font-size":44, "pointer-events":"none" }, world, d.deco[k % d.deco.length]);
    if (e.idea){
      el("rect", { x:cx - 75, y:G - 150, width:150, height:150, fill:"#fff", "fill-opacity":night ? .12 : .45, stroke:d.roof, "stroke-width":3, "stroke-dasharray":"10 8" }, world);
      el("path", { d:"M" + (cx - 75) + " " + (G - 100) + " h150 M" + (cx - 75) + " " + (G - 50) + " h150 M" + (cx - 25) + " " + (G - 150) + " v150 M" + (cx + 25) + " " + (G - 150) + " v150", stroke:d.roof, "stroke-opacity":.5, "stroke-width":2, fill:"none" }, world);
      el("text", { x:cx, y:G - 160, "text-anchor":"middle", "font-size":44, "pointer-events":"none" }, world, "🏗️");
      el("text", { x:cx, y:G + 38, "text-anchor":"middle", "class":"lab soft" }, world, e.idea); return; }
    var it = e.it, lk = K.locked(it), h = (it.tall ? 330 : 220) + Math.round(K.rnd(di, k) * 60);
    var g = el("g", { "class":"bld", tabindex:0, role:"button", "aria-label":it.title + (lk ? "（長大一點再來）" : "") }, world);
    var top = tower(g, cx, 156, h, d, di === 3 ? 1 : di === 5 ? 5 : di, lk);
    el("text", { x:cx, y:top + 74, "text-anchor":"middle", "font-size":46, "pointer-events":"none" }, g.firstChild, lk ? "☁️" : it.emo);
    el("text", { x:cx, y:G + 38, "text-anchor":"middle", "class":"lab" }, g, (lk ? "🔒 " : "") + it.short);
    g._d = d; g._it = it;
  });
});
// the end of the street: where the city grows next
el("text", { x:END + 60, y:G + 6, "font-size":64, "pointer-events":"none" }, world, "🚧");
el("text", { x:END + 250, y:G - 4, "font-size":80, "pointer-events":"none" }, world, "🏗️");
el("text", { x:END + 250, y:G + 38, "text-anchor":"middle", "class":"lab" }, world, "大街還在往這邊蓋");
var bus = el("text", { "font-size":64, "pointer-events":"none" }, world, "🚌");
if (K.calm){ bus.setAttribute("x", 700); bus.setAttribute("y", G + 118); }
else el("animateTransform", { attributeName:"transform", type:"translate", from:(W + 200) + " " + (G + 118), to:"-400 " + (G + 118), dur:"48s", repeatCount:"indefinite" }, bus);

var cam = K.camera(stage, world, { bounds:[0, 0, W, VH], fixed:function(){ return stage.clientHeight / VH; },
  onMove:function(c){ var tr = "translate(" + (stage.clientWidth / 2 - c.x * c.s) + " " + (stage.clientHeight / 2 - c.y * c.s) + ") scale(" + c.s + ")";
    hills.setAttribute("transform", tr + " translate(" + c.x * .45 + " 0)"); sky.setAttribute("transform", tr + " translate(" + c.x * .8 + " 0)"); },
  onPick:function(g, a){ var b = g.getBBox(); a.fly(b.x + b.width / 2, 0); } });
function home(now){ var s = stage.clientHeight / VH, hx = D[0].x0 + stage.clientWidth / 2 / s - 30; if (now) cam.set(hx, VH / 2, s); else cam.fly(hx, VH / 2); }
document.getElementById("zhome").onclick = function(){ K.closeSheet(); home(); };
K.chips(function(d){ cam.fly(d.x0 + stage.clientWidth / 2 / cam.cam.s - 30, 0); });
home(true);
})();
</script>
</body>
</html>
